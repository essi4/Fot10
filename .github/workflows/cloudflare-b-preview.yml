name: Cloudflare B preview

on:
  push:
    branches:
      - cloudflare-b-config
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# This workflow deploys the B branch to the LIVE `fot10` Worker.
# It intentionally uses the production wrangler.jsonc configuration.
# Secrets required in GitHub Actions environment/repository:
# CLOUDFLARE_API_TOKEN
# CLOUDFLARE_ACCOUNT_ID

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - name: Checkout B branch
        uses: actions/checkout@v6
        with:
          ref: cloudflare-b-config

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: OpenNext build
        run: ./node_modules/.bin/opennextjs-cloudflare build

      - name: Deploy LIVE Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/opennextjs-cloudflare deploy

# Triggered by push to cloudflare-b-config: this deploys the built OpenNext Worker live.
