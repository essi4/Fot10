name: Cloudflare B preview

on:
  push:
    branches:
      - cloudflare-b-config
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# This workflow deploys the B branch to the LIVE `fot10` Worker.
# Secrets required in GitHub Actions environment/repository:
# CLOUDFLARE_API_TOKEN
# CLOUDFLARE_ACCOUNT_ID
# SPORTS_API_KEY

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - name: Checkout B branch
        uses: actions/checkout@v6
        with:
          ref: cloudflare-b-config

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: OpenNext build
        run: ./node_modules/.bin/opennextjs-cloudflare build

      - name: Sync live sports API secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
        run: |
          if [ -z "$SPORTS_API_KEY" ]; then
            echo "SPORTS_API_KEY is not configured in the cloudflare-preview GitHub environment."
            exit 1
          fi
          printf '%s' "$SPORTS_API_KEY" | ./node_modules/.bin/wrangler secret put SPORTS_API_KEY

      - name: Deploy LIVE Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/opennextjs-cloudflare deploy

# Triggered by push to cloudflare-b-config: this deploys the built OpenNext Worker live.
