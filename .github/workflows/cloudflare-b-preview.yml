name: Cloudflare B preview

on:
  push:
    branches:
      - cloudflare-b-config
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Secrets must be configured in the GitHub Actions environment/repository:
# CLOUDFLARE_API_TOKEN
# CLOUDFLARE_ACCOUNT_ID
# This workflow deploys a non-production Worker dedicated to the B preview.
# It intentionally does NOT promote or modify the production `fot10` Worker.
# One-time verification trigger: keep the preview deploy path validated.

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - name: Checkout B branch
        uses: actions/checkout@v6
        with:
          ref: cloudflare-b-config

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: OpenNext build
        run: ./node_modules/.bin/opennextjs-cloudflare build

      - name: Deploy isolated Cloudflare preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/opennextjs-cloudflare deploy --config=wrangler.preview.jsonc
