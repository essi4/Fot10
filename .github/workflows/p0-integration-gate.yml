name: FOT10 P0 Integration Gate

on:
  push:
    branches:
      - branch/p0-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Standard Gate — P0 tests
        run: |
          node --experimental-default-type=module --test \
            test/p0-date-leak.test.mjs \
            test/p0-timezone.test.mjs \
            test/p0-cache-keying.test.mjs \
            test/push-security.test.mjs

      - name: Security Gate — dependency audit
        run: npm audit --audit-level=high

      - name: Build Gate — production build
        run: npm run build
