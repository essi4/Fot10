name: FOT10 Cloudflare Production

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - name: Checkout synced production branch
        uses: actions/checkout@v6
        with:
          ref: cloudflare-production-sync

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Next 14 compatible OpenNext adapter
        run: npm install --no-save @opennextjs/cloudflare@1.15.1

      - name: Build OpenNext for Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Verify OpenNext output
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
