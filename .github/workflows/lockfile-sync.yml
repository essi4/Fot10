name: Cloudflare B lockfile sync

on:
  push:
    branches:
      - cloudflare-b-config
    paths:
      - .lockfile-sync-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cloudflare B
        uses: actions/checkout@v4
        with:
          ref: cloudflare-b-config
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
          else
            git commit -m "fix: sync cloudflare dependency lockfile"
            git push origin HEAD:cloudflare-b-config
          fi
