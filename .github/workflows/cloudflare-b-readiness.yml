name: Cloudflare B readiness

on:
  push:
    branches:
      - cloudflare-b-config
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout B branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-b-config

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: OpenNext build
        run: npx --yes opennextjs-cloudflare build

      - name: Wrangler deploy dry-run
        run: npx --yes wrangler@4.68.0 deploy --dry-run

      - name: Secret exposure scan
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z | xargs -0 grep -nEI '(^|[^A-Za-z])(sk-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|PRIVATE_KEY|SECRET_KEY|API_SECRET|DATABASE_URL=|SPORTS_API_KEY=|API_SPORTS_KEY=|FOOTBALL_API_KEY=)' --exclude='.env.example' --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.open-next; then
            echo 'Potential secret material found in tracked source.'
            exit 1
          fi
          echo 'No obvious secret material found in tracked source.'

      - name: Start Worker preview
        shell: bash
        env:
          NEXT_PUBLIC_FOT10_DEMO: "false"
        run: |
          set -euo pipefail
          npx --yes opennextjs-cloudflare preview --ip 127.0.0.1 --port 8787 > /tmp/fot10-worker.log 2>&1 &
          echo $! > /tmp/fot10-worker.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/health.json 2>/dev/null; then break; fi
            sleep 2
          done
          test -s /tmp/health.json

      - name: Smoke test Worker route handlers
        shell: bash
        run: |
          set -euo pipefail
          check() {
            path="$1"
            expected="$2"
            code=$(curl -sS -o /tmp/response.json -w '%{http_code}' "http://127.0.0.1:8787${path}")
            echo "${path} -> ${code}"
            test "$code" = "$expected"
          }
          check /api/health 200
          check /api/football/config 200
          check /api/football/status 503
          check /api/football/live 200
          check /api/football/fixtures?date=2026-09-11 200
          echo 'Core Worker route handlers passed.'

      - name: Show preview log on failure
        if: failure()
        run: tail -n 120 /tmp/fot10-worker.log || true

      # B-only readiness gate; no production deployment is performed here.
