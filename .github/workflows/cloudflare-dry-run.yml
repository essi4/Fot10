name: Cloudflare B dry-run

on:
  push:
    branches:
      - cloudflare-dry-run
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cloudflare-dry-run.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/cloudflare-dry-run.sh'
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Cloudflare setup dry-run
        run: npx --yes wrangler@4.68.0 setup --dry-run
