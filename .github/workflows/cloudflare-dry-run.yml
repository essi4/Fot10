name: Cloudflare B dry-run

on:
  push:
    branches:
      - cloudflare-dry-run
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Cloudflare setup dry-run
        run: npx --yes wrangler@4.68.0 setup --dry-run
