name: FOT10 Dependency Security Gate

on:
  push:
    branches:
      - branch/dep-security-fix

permissions:
  contents: write

jobs:
  secure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh lockfile for pinned dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile only when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile [skip ci]"
          git push

      - name: Install dependencies from lockfile
        run: npm ci

      - name: P0 + security tests
        run: |
          node --experimental-default-type=module --test \
            test/p0-date-leak.test.mjs \
            test/p0-timezone.test.mjs \
            test/p0-cache-keying.test.mjs \
            test/push-security.test.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build
